<!DOCTYPE html>
<!--
  デザインカンプ: WLK001 記録画面（待機中・記録中の2状態）
  画面仕様: WLK001-recording.md
  デザインシステム: ../_design-assets/bundle.js (WalkingTrackerDesignSystem_145207)

  ブラウザで開くと実際のビジュアルを確認できます。
  URL に ?state=recording を付けると記録中の状態を表示します。

  AI実装参照: このファイルの <script> ブロックに
  コンポーネント構成・レイアウト・デザイントークンの使用方法が記述されています。
-->
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WLK001 記録画面 — WalkingTracker デザインカンプ</title>
  <link rel="stylesheet" href="./_design-assets/tokens.css" />
  <style>
    .state-switcher {
      position: fixed; top: 16px; right: 16px; z-index: 100;
      display: flex; gap: 8px; flex-direction: column;
    }
    .state-btn {
      padding: 8px 14px; border-radius: 20px; border: 1px solid #8C6239;
      background: #fff; color: #8C6239; font-size: 12px; font-weight: 500;
      cursor: pointer; font-family: sans-serif;
    }
    .state-btn.active { background: #8C6239; color: #fff; }
  </style>
</head>
<body>
<div id="root"></div>
<div class="state-switcher">
  <button class="state-btn" id="btn-idle" onclick="switchState('idle')">待機中</button>
  <button class="state-btn" id="btn-recording" onclick="switchState('recording')">記録中</button>
  <button class="state-btn" id="btn-gps" onclick="switchState('gps')">GPS取得中</button>
</div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="./_design-assets/bundle.js"></script>

<script>
// ----------------------------------------------------------------
// WLK001 RecordingScreen — デザインカンプマウント
//
// 画面構成 (MapOverlayTemplate):
//   PhoneFrame
//   └─ RecordingScreen
//        ├─ MapCanvas (全画面, 背景)
//        │   ├─ 等高線・植生・河川 SVG (地形図スタンドイン)
//        │   ├─ 過去軌跡 polyline (--map-track-past, opacity 0.6)
//        │   ├─ 現在軌跡 polyline (--map-track-current, #CC3333) ← 記録中のみ
//        │   └─ 現在地マーカー circle (--map-location + --map-location-halo)
//        │
//        ├─ GPS取得中チップ (surface, shape-full, shadow-overlay) ← GPS未取得時
//        │   └─ CircularProgressIndicator + "GPS信号を取得中…"
//        │
//        ├─ 記録中ピル (--md-error 背景, shape-full) ← 記録中のみ
//        │   └─ 白ドット + "記録中"
//        │
//        └─ コントロールパネル (surface, shape-lg=16dp, shadow-overlay)
//             ├─ StatPanel [待機中]: MetricItem×2 (今日の歩数 / 今日の距離)
//             ├─ StatPanel [記録中]: MetricItem×3 (歩数 / 距離 / 経過) + Divider
//             └─ DualStateButton
//                  待機中: Primary茶, play_arrow, "記録を開始する"
//                  記録中: Error赤,  stop,       "記録を停止する"
//
// デザイントークン使用箇所:
//   --map-track-current / --map-track-past / --map-location  : 地図描画色
//   --md-error                     : 記録中ピル・DualStateButton(記録中)
//   --md-primary                   : DualStateButton(待機中)
//   --md-surface / --shape-lg      : コントロールパネル
//   --shadow-overlay               : GPS取得中チップ・コントロールパネル
//   --type-headline-medium-*       : MetricItem の数値 (28sp)
//   --font-feature-tnum            : 数値テキスト（幅固定タブラー数字）
//   --button-height-tall (56dp)    : DualStateButton の高さ
// ----------------------------------------------------------------

const { PhoneFrame, RecordingScreen } = window.WTKit;

const STATES = {
  idle:      { recording: false, gpsReady: true,  elapsed: 0,   steps: "3,480", distance: "2.4" },
  recording: { recording: true,  gpsReady: true,  elapsed: 137, steps: "1,640", distance: "1.1" },
  gps:       { recording: false, gpsReady: false,  elapsed: 0,  steps: "3,480", distance: "2.4" },
};
let current = new URLSearchParams(location.search).get("state") || "idle";

function switchState(s) {
  current = s;
  document.querySelectorAll(".state-btn").forEach(b => b.classList.remove("active"));
  document.getElementById("btn-" + s)?.classList.add("active");
  render();
}

function render() {
  const s = STATES[current];
  ReactDOM.createRoot(document.getElementById("root")).render(
    React.createElement(PhoneFrame, null,
      React.createElement(RecordingScreen, {
        recording: s.recording,
        gpsReady: s.gpsReady,
        elapsed: s.elapsed,
        steps: s.steps,
        distance: s.distance,
        onStart: () => switchState("recording"),
        onStop: () => switchState("idle"),
      })
    )
  );
}

switchState(current);
</script>
</body>
</html>
