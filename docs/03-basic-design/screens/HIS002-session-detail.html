<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HIS002 記録詳細 — WalkingTracker デザインカンプ</title>
  <link rel="stylesheet" href="./_design-assets/tokens.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="./_design-assets/bundle.js"></script>

<script>
// ----------------------------------------------------------------
// HIS002 SessionDetailScreen — デザインカンプマウント
//
// 画面構成 (DetailTemplate):
//   PhoneFrame
//   └─ SessionDetailScreen
//        ├─ TopBar
//        │   ├─ arrow_back ボタン (48dp タッチターゲット, on-surface)
//        │   └─ タイトル: セッション日付 (titleLarge, on-surface)
//        ├─ MapCanvas (height=46%, flex:none)
//        │   └─ セッション軌跡 polyline (--map-track-current, #CC3333)
//        └─ 詳細リスト (overflow-auto, padding 8/20)
//             ├─ 歩数    行 + Divider
//             ├─ 距離    行 + Divider
//             ├─ 所要時間行 + Divider
//             ├─ 開始時刻行 + Divider
//             └─ 終了時刻行
//
// 詳細行のスタイル:
//   padding: 14px 0 (上下)
//   ラベル:  bodyLarge, on-surface-variant
//   値:      titleMedium (Medium 500), on-surface, tnum
//
// TopBar のスタイル:
//   height: top-app-bar-height (64dp)
//   background: surface (#F8F4EA)
//   タイトル: titleLarge (22sp, Regular 400)
//
// デザイントークン使用箇所:
//   --map-track-current            : セッション軌跡色 (#CC3333)
//   --md-surface                   : TopBar 背景
//   --md-on-surface                : TopBar タイトル・値テキスト
//   --md-on-surface-variant        : ラベルテキスト
//   --md-outline-variant           : Divider 色
//   --top-app-bar-height (64dp)    : TopBar 高さ
//   --type-title-large-*           : TopBar タイトル (22sp)
//   --type-body-large-*            : 詳細行ラベル (16sp)
//   --type-title-medium-*          : 詳細行値 (16sp, Medium)
//   --font-feature-tnum            : 数値テキスト
// ----------------------------------------------------------------

const { PhoneFrame, SessionDetailScreen } = window.WTKit;

const SESSION = {
  id: 1,
  date: "2026/06/27（金）",
  steps: "12,345 歩",
  distance: "8.7 km",
  duration: "45分",
  start: "09:12",
  end: "09:57",
  trace: "16,84 22,76 30,74 36,64 44,60 52,62 58,52 66,48 72,40 80,36",
};

function Root() {
  return React.createElement(PhoneFrame, null,
    React.createElement(SessionDetailScreen, { session: SESSION, onBack: () => {} })
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Root));
</script>
</body>
</html>
