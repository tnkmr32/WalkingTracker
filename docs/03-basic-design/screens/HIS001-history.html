<!DOCTYPE html>
<!--
  デザインカンプ: HIS001 記録履歴画面
  画面仕様: HIS001-history.md
  デザインシステム: ../_design-assets/bundle.js (WalkingTrackerDesignSystem_145207)

  ブラウザで開くと実際のビジュアルを確認できます。
  SessionCard をクリックすると HIS002 詳細画面へ遷移するデモを確認できます。

  AI実装参照: このファイルの <script> ブロックに
  コンポーネント構成・レイアウト・デザイントークンの使用方法が記述されています。
-->
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>HIS001 記録履歴 — WalkingTracker デザインカンプ</title>
  <link rel="stylesheet" href="./_design-assets/tokens.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="./_design-assets/bundle.js"></script>

<script>
// ----------------------------------------------------------------
// HIS001 HistoryScreen — デザインカンプマウント
//
// 画面構成 (TabNavigationTemplate):
//   PhoneFrame
//   └─ [TabNavigationTemplate]
//        ├─ HistoryScreen
//        │    ├─ タイトルバー "記録履歴" (titleLarge, on-surface, padding 8/20)
//        │    ├─ フィルターチップ行 (gap 8dp)
//        │    │   ├─ Chip "すべて"  icon=list  (selected → secondary-container)
//        │    │   ├─ Chip "今週"   icon=event
//        │    │   └─ Chip "今月"   icon=calendar_month
//        │    └─ SessionList (overflow-auto, padding 12/16, gap 10dp)
//        │        └─ SessionCard ×5 (日付降順)
//        │            ├─ 円形アバター (primary-container, 40dp, directions_walk)
//        │            ├─ テキスト列
//        │            │   ├─ 日付 (titleMedium, on-surface)
//        │            │   └─ サブ行 "歩数 ・ 距離 ・ 所要時間" (bodyMedium, on-surface-variant, tnum)
//        │            └─ chevron_right (outline)
//        └─ BottomNavigationBar (value="history")
//
// SessionCard のカードスタイル:
//   background: surface-container-lowest (#FFFFFF)
//   border: 1px solid outline-variant (#D0C3B0)
//   border-radius: radius-card (12dp)
//   box-shadow: shadow-card (elevation-1)
//   padding: 14px 16px
//
// デザイントークン使用箇所:
//   --md-primary-container         : SessionCard アバター背景
//   --md-on-primary-container      : SessionCard アバターアイコン色
//   --md-secondary-container       : 選択チップ背景
//   --md-surface-container-lowest  : カード背景
//   --md-outline-variant           : カード枠線 + Chip 非選択枠
//   --type-title-large-*           : "記録履歴" タイトル
//   --type-title-medium-*          : 日付テキスト
//   --type-body-medium-*           : サブ行テキスト
//   --font-feature-tnum            : サブ行の数値
// ----------------------------------------------------------------

const { PhoneFrame, HistoryScreen, SessionDetailScreen } = window.WTKit;
const { BottomNavigationBar } = window.WalkingTrackerDesignSystem_145207;

const SESSIONS = [
  { id: 1, date: "2026/06/27（金）", steps: "12,345 歩", distance: "8.7 km", duration: "45分", start: "09:12", end: "09:57", trace: "16,84 22,76 30,74 36,64 44,60 52,62 58,52 66,48 72,40 80,36" },
  { id: 2, date: "2026/06/25（水）", steps: "8,200 歩",  distance: "5.4 km", duration: "32分", start: "07:40", end: "08:12", trace: "20,80 28,78 34,68 42,64 48,54 56,52 62,44" },
  { id: 3, date: "2026/06/24（火）", steps: "4,100 歩",  distance: "2.8 km", duration: "18分", start: "18:05", end: "18:23", trace: "24,82 32,76 40,72 46,62 52,58" },
  { id: 4, date: "2026/06/22（日）", steps: "16,980 歩", distance: "11.3 km", duration: "62分", start: "06:30", end: "07:32", trace: "12,86 20,80 28,80 34,70 42,66 50,66 58,56 66,52 74,44 82,40 90,30" },
  { id: 5, date: "2026/06/20（金）", steps: "6,540 歩",  distance: "4.2 km", duration: "26分", start: "12:10", end: "12:36", trace: "22,78 30,74 36,66 44,60 50,56" },
];

function Root() {
  const [detail, setDetail] = React.useState(null);

  if (detail) {
    return React.createElement(PhoneFrame, null,
      React.createElement(SessionDetailScreen, { session: detail, onBack: () => setDetail(null) })
    );
  }

  return React.createElement(PhoneFrame, null,
    React.createElement("div", {
      style: { flex: 1, display: "flex", flexDirection: "column", minHeight: 0 }
    },
      React.createElement("div", {
        style: { flex: 1, minHeight: 0, display: "flex", flexDirection: "column" }
      },
        React.createElement(HistoryScreen, { sessions: SESSIONS, onOpen: setDetail })
      ),
      React.createElement(BottomNavigationBar, { value: "history" })
    )
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(React.createElement(Root));
</script>
</body>
</html>
