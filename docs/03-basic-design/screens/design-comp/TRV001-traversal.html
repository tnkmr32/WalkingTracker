<!DOCTYPE html>
<!--
  デザインカンプ: TRV001 踏破画面
  画面仕様: TRV001-traversal.md
  表示状態: 東海道・210/500km（42%）踏破済み
  ※ JS不使用・静的HTML+CSSのみ
-->
<html lang="ja">
<head>
<meta charset="utf-8">
<title>TRV001 踏破画面 — WalkingTracker</title>
<style>
@import url("https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap");
@import url("https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0&display=swap");
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#E7E0D2;background-image:radial-gradient(circle at 30% 20%,rgba(140,98,57,.06),transparent 60%);padding:28px;font-family:'Roboto','Helvetica Neue',Arial,sans-serif;}
.ic{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 0,'wght' 400,'GRAD' 0,'opsz' 24;}
.ic-f{font-family:'Material Symbols Rounded';font-weight:400;font-style:normal;font-size:24px;line-height:1;letter-spacing:normal;text-transform:none;display:inline-block;white-space:nowrap;-webkit-font-smoothing:antialiased;font-variation-settings:'FILL' 1,'wght' 400,'GRAD' 0,'opsz' 24;}
</style>
</head>
<body>

<!-- PhoneFrame -->
<div style="width:412px;height:892px;background:#0c0a08;border-radius:44px;padding:11px;box-shadow:0 30px 70px rgba(31,27,22,.34),0 4px 12px rgba(31,27,22,.22);">
  <div style="width:100%;height:100%;background:#F8F4EA;border-radius:34px;overflow:hidden;display:flex;flex-direction:column;">

    <!-- Status bar -->
    <div style="height:34px;flex:none;display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:relative;color:#1F1B16;font-size:13px;font-weight:500;z-index:5;">
      <span style="font-feature-settings:'tnum';">9:41</span>
      <div style="position:absolute;left:50%;top:9px;transform:translateX(-50%);width:84px;height:20px;background:#0c0a08;border-radius:12px;"></div>
      <span style="display:inline-flex;gap:6px;align-items:center;">
        <span class="ic" style="font-size:16px;">signal_cellular_alt</span>
        <span class="ic" style="font-size:16px;">wifi</span>
        <span class="ic-f" style="font-size:16px;">battery_full</span>
      </span>
    </div>

    <!-- TRV001 TraversalScreen -->
    <div style="flex:1;display:flex;flex-direction:column;min-height:0;">

      <!-- サマリーセクション -->
      <div style="padding:16px 20px 18px;background:#F8F4EA;flex:none;">

        <!-- ヘッダー: route + 東海道 -->
        <div style="display:flex;align-items:center;gap:10px;margin-bottom:16px;">
          <span class="ic" style="font-size:26px;color:#8C6239;">route</span>
          <h1 style="font-size:24px;font-weight:400;color:#1F1B16;">東海道</h1>
        </div>

        <!-- 踏破進捗ラベル + % -->
        <div style="display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:8px;">
          <span style="font-size:14px;font-weight:500;color:#1F1B16;">踏破進捗</span>
          <span style="font-size:24px;line-height:1;font-weight:400;color:#8C6239;font-feature-settings:'tnum';">42%</span>
        </div>

        <!-- LinearProgressBar -->
        <div style="width:100%;height:10px;background:#F2E5CF;border-radius:9999px;overflow:hidden;">
          <div style="width:42%;height:100%;background:#8C6239;border-radius:9999px;"></div>
        </div>

        <!-- 3つのサマリーカード -->
        <div style="display:flex;gap:10px;margin-top:18px;">

          <div style="flex:1;background:#F5EFE2;border-radius:12px;padding:12px 14px;">
            <div style="font-size:12px;font-weight:500;color:#4F4539;margin-bottom:4px;">踏破済み</div>
            <div style="display:flex;align-items:baseline;gap:3px;">
              <span style="font-size:24px;line-height:1;font-weight:400;color:#4A7A50;font-feature-settings:'tnum';">210</span>
              <span style="font-size:12px;color:#4F4539;">km</span>
            </div>
          </div>

          <div style="flex:1;background:#F5EFE2;border-radius:12px;padding:12px 14px;">
            <div style="font-size:12px;font-weight:500;color:#4F4539;margin-bottom:4px;">全体距離</div>
            <div style="display:flex;align-items:baseline;gap:3px;">
              <span style="font-size:24px;line-height:1;font-weight:400;color:#1F1B16;font-feature-settings:'tnum';">500</span>
              <span style="font-size:12px;color:#4F4539;">km</span>
            </div>
          </div>

          <div style="flex:1;background:#F5EFE2;border-radius:12px;padding:12px 14px;">
            <div style="font-size:12px;font-weight:500;color:#4F4539;margin-bottom:4px;">あと</div>
            <div style="display:flex;align-items:baseline;gap:3px;">
              <span style="font-size:24px;line-height:1;font-weight:400;color:#2A7FA8;font-feature-settings:'tnum';">290</span>
              <span style="font-size:12px;color:#4F4539;">km</span>
            </div>
          </div>

        </div>
      </div>

      <!-- MapCanvas（踏破区間つき） -->
      <div style="flex:1;position:relative;min-height:0;">
        <div style="position:absolute;inset:0;overflow:hidden;background:#F4EFE1;">
          <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" style="position:absolute;inset:0;width:100%;height:100%;">
            <!-- 等高線 -->
            <g fill="none" stroke="#C9A36F" stroke-width="0.35" opacity="0.55">
              <path d="M-5,20 C20,10 40,28 60,18 S95,8 110,22"/>
              <path d="M-5,30 C20,22 42,38 60,28 S95,20 110,32"/>
              <path d="M-5,42 C22,34 44,50 62,40 S96,32 112,44"/>
              <path d="M-5,58 C24,50 46,64 64,54 S96,48 112,60"/>
              <path d="M-5,72 C24,66 48,78 66,70 S96,64 112,76"/>
              <path d="M-5,86 C24,82 48,92 66,84 S96,80 112,90"/>
            </g>
            <g fill="none" stroke="#BE9560" stroke-width="0.4" opacity="0.6">
              <ellipse cx="74" cy="60" rx="13" ry="9"/>
              <ellipse cx="74" cy="60" rx="8.5" ry="5.8"/>
              <ellipse cx="74" cy="60" rx="4.5" ry="3"/>
            </g>
            <path d="M2,62 C14,54 26,60 30,72 C32,84 20,92 8,90 C-2,88 -4,70 2,62 Z" fill="#CFE3C6" opacity="0.7"/>
            <path d="M-5,8 C18,18 30,10 44,24 C58,38 50,56 64,70 C74,80 84,80 105,92" fill="none" stroke="#9CC8DE" stroke-width="1.6" opacity="0.85" stroke-linecap="round"/>
            <g stroke="#D8C9AE" stroke-width="0.5" opacity="0.9">
              <line x1="36" y1="-5" x2="44" y2="105"/>
              <line x1="-5" y1="48" x2="105" y2="40"/>
            </g>
            <!-- 踏破済み区間（緑） -->
            <polyline points="10,86 18,80 26,82 33,72 40,68" fill="none" stroke="#4A7A50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="40,68 47,70 53,60 58,56" fill="none" stroke="#4A7A50" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- 未踏区間（グレー） -->
            <polyline points="58,56 62,48 68,46 73,40" fill="none" stroke="#D8D0C0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            <polyline points="73,40 80,36 86,38 92,28" fill="none" stroke="#D8D0C0" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            <!-- 現在地マーカー -->
            <circle cx="58" cy="56" r="5" fill="rgba(204,51,51,0.18)"/>
            <circle cx="58" cy="56" r="2" fill="#CC3333" stroke="#fff" stroke-width="0.7"/>
          </svg>

          <!-- 凡例 -->
          <div style="position:absolute;bottom:14px;left:16px;background:#F8F4EA;border-radius:8px;box-shadow:0 1px 2px rgba(31,27,22,.18),0 1px 3px 1px rgba(31,27,22,.10);padding:10px 14px;display:flex;flex-direction:column;gap:8px;">
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="width:18px;height:4px;border-radius:2px;background:#4A7A50;display:inline-block;"></span>
              <span style="font-size:12px;color:#1F1B16;">踏破済み区間</span>
            </div>
            <div style="display:flex;align-items:center;gap:8px;">
              <span style="width:18px;height:4px;border-radius:2px;background:#D8D0C0;display:inline-block;"></span>
              <span style="font-size:12px;color:#1F1B16;">未踏区間</span>
            </div>
          </div>

        </div>
      </div>

      <!-- BottomNavigationBar -->
      <nav style="height:80px;flex:none;display:flex;background:#EFE8D9;box-shadow:0 -1px 2px rgba(31,27,22,.08);">

        <!-- 記録タブ（非選択） -->
        <button style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:none;background:transparent;padding-top:12px;padding-bottom:16px;cursor:pointer;">
          <span style="display:inline-flex;align-items:center;justify-content:center;width:64px;height:32px;border-radius:9999px;">
            <span class="ic" style="font-size:24px;color:#4F4539;">directions_walk</span>
          </span>
          <span style="font-size:12px;font-weight:500;letter-spacing:0.5px;color:#4F4539;">記録</span>
        </button>

        <!-- 踏破タブ（選択中） -->
        <button style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:none;background:transparent;padding-top:12px;padding-bottom:16px;cursor:pointer;">
          <span style="display:inline-flex;align-items:center;justify-content:center;width:64px;height:32px;border-radius:9999px;background:#C5E3C5;">
            <span class="ic-f" style="font-size:24px;color:#082E0E;">map</span>
          </span>
          <span style="font-size:12px;font-weight:500;letter-spacing:0.5px;color:#1F1B16;">踏破</span>
        </button>

        <!-- 履歴タブ（非選択） -->
        <button style="flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:none;background:transparent;padding-top:12px;padding-bottom:16px;cursor:pointer;">
          <span style="display:inline-flex;align-items:center;justify-content:center;width:64px;height:32px;border-radius:9999px;">
            <span class="ic" style="font-size:24px;color:#4F4539;">history</span>
          </span>
          <span style="font-size:12px;font-weight:500;letter-spacing:0.5px;color:#4F4539;">履歴</span>
        </button>

      </nav>
    </div>

  </div>
</div>

</body>
</html>
