<!DOCTYPE html>
<!--
  デザインカンプ: SET001 パーミッションリクエスト画面
  画面仕様: SET001-permission.md
  デザインシステム: ../_design-assets/bundle.js (WalkingTrackerDesignSystem_145207)

  ブラウザで開くと実際のビジュアルを確認できます。
  AI実装参照: このファイルの <script type="text/javascript"> ブロックに
  コンポーネント構成・レイアウト・デザイントークンの使用方法が記述されています。

  表示状態: パーミッション未付与（初回起動相当）
-->
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SET001 パーミッション画面 — WalkingTracker デザインカンプ</title>
  <link rel="stylesheet" href="./_design-assets/tokens.css" />
</head>
<body>
<div id="root"></div>

<script src="https://unpkg.com/react@18.3.1/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js" crossorigin></script>
<script src="./_design-assets/bundle.js"></script>

<script>
// ----------------------------------------------------------------
// SET001 PermissionScreen — デザインカンプマウント
//
// 画面構成:
//   PhoneFrame
//   └─ PermissionScreen
//        ├─ ヒーローアイコン (hiking, 88dp, Primary Container)
//        ├─ タイトル (headlineSmall)
//        ├─ 説明文 (bodyMedium)
//        ├─ 権限リスト ×3 (surface-container-low カード)
//        │   ├─ 位置情報 (location_on, Secondary)
//        │   ├─ 身体活動 (directions_walk, Secondary)
//        │   └─ 通知     (notifications, Secondary)
//        ├─ FilledButton large fullWidth "権限を許可する" (Primary)
//        └─ 注意文言 ※ (bodySmall, on-surface-variant)
//
// デザイントークン使用箇所:
//   --md-primary-container / --md-on-primary-container : ヒーローアイコン背景
//   --md-secondary               : 権限アイコン色
//   --md-surface-container-low   : 権限リスト行背景
//   --shape-full                 : ヒーローアイコン円
//   --shape-md                   : 権限リスト行角丸
//   --type-headline-small-*      : タイトル
//   --type-body-medium-*         : 説明文
//   --type-body-small-*          : 注意文言
//   --type-title-small-*         : 権限行タイトル
// ----------------------------------------------------------------

const { PhoneFrame, PermissionScreen } = window.WTKit;

function Root() {
  return React.createElement(PhoneFrame, null,
    React.createElement(PermissionScreen, { onGrant: () => {} })
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(
  React.createElement(Root)
);
</script>
</body>
</html>
